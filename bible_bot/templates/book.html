<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ book_name }} — Библия онлайн</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #8B4513;
            text-decoration: none;
            font-size: 1.1em;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        h1 {
            color: #333;
            border-bottom: 2px solid #8B4513;
            padding-bottom: 10px;
        }
        
        .chapter-list {
            list-style: none;
            padding: 0;
            background: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .chapter-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }
        
        .chapter-item:last-child {
            border-bottom: none;
        }
        
        .chapter-item:hover {
            background: #f9f9f9;
        }
        
        .chapter-item a {
            text-decoration: none;
            color: #333;
            flex-grow: 1;
            font-size: 1.1em;
        }
        
        .chapter-item a:hover {
            color: #8B4513;
        }
        
        .verse-count {
            color: #666;
            font-size: 0.9em;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Назад к списку книг</a>
    
    <h1>📖 {{ book_name }}</h1>
    
    <<h2>Список ({{ chapters|length }})</h2>
    
    <ul class="chapter-list">
        {% for chapter in chapters %}
            <li class="chapter-item">
                <a href="/book/{{ book_order }}/chapter/{{ chapter.chapter }}">
                    {{ chapter_name }} {{ chapter.chapter }}
                </a>
                <span class="verse-count">{{ chapter.verse_count }} стихов</span>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
